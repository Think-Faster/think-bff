services:
  bff-migrations:
    build:
      context: ../..
      dockerfile: deploy/migration/Dockerfile.migrations
    image: bff-migrations:latest
    env_file:
      - .env
    environment:
      # См. docs/VAULT_MIGRATION.md — та же схема, что у tf-bff, но под bff_admin (DDL-права).
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:?VAULT_ROLE_ID is not set}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:?VAULT_SECRET_ID is not set}
      VAULT_SECRET_PATHS: postgres/bff
      VAULT_EXPAND: DB_MIGRATION_PASSWORD
      DB_MIGRATION_PASSWORD: "$${TF_PG_BFF_ADMIN_PASSWORD}"
    networks:
      - app-network
      - postgree_app-network
    restart: "no"
    profiles: ["migrations"]

networks:
  app-network:
    external: true
    # Без значения по умолчанию — см. тот же комментарий в deploy/docker-compose.yml. DOCKER_NETWORK
    # здесь и в deploy/.env должны совпадать (это одна и та же внешняя сеть, в которой сидит Vault и
    # tf-bff), иначе тихий фолбэк на разные сети даёт 10 минут ретраев логина в Vault вместо мгновенной
    # ошибки.
    name: ${DOCKER_NETWORK:?DOCKER_NETWORK is not set}
  postgree_app-network:
    external: true
