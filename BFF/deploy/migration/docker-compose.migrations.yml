services:
  bff-migrations:
    build:
      context: ../..
      dockerfile: deploy/migration/Dockerfile.migrations
    image: bff-migrations:latest
    env_file:
      - .env
    environment:
      # См. docs/VAULT_MIGRATION.md — та же схема, что у tf-bff, но под bff_admin (DDL-права).
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:?VAULT_ROLE_ID is not set}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:?VAULT_SECRET_ID is not set}
      VAULT_SECRET_PATHS: postgres/bff
      VAULT_EXPAND: DB_MIGRATION_PASSWORD
      DB_MIGRATION_PASSWORD: "$${TF_PG_BFF_ADMIN_PASSWORD}"
    networks:
      - app-network
      - postgree_app-network
    restart: "no"
    profiles: ["migrations"]

networks:
  app-network:
    external: true
    name: ${DOCKER_NETWORK:-app-network}
  postgree_app-network:
    external: true
